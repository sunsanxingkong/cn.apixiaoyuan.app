name: Unzip Uploaded Zip
on:
  push:
    paths:
      - '**.zip'

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unzip files
        run: |
          for f in *.zip; do
            unzip -o "$f"
          done

      - name: Commit & Push extracted files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "auto unzip zip file" || echo "no changes"
          git push
